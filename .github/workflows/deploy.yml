name: Deploy Extension to ECS

on:
    push:
        branches:
            - release/prod

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Deploy Extension
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.ECS_HOST }}
                  username: ${{ secrets.ECS_USERNAME }}
                  key: ${{ secrets.ECS_SSH_KEY }}

                  script: |
                      # 1. Go to a working directory on ECS for extension repo
                      cd /opt/chrome-extension
                      # pull latest extension code
                      git pull origin release/prod

                      # 2. Install dependencies and build vue extension
                      npm install
                      npm run build

                      # 3. Package dist folder
                      rm -f dist.zip
                      zip -r dist.zip dist

                      # 4. Copy zip file into Next.js shared folder
                      cp dist.zip /opt/build-own-vocabulary/extension-dist/dist.zip
