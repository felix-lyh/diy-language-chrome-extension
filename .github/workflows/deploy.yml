name: Deploy Extension to ECS

on:
    push:
        branches:
            - release/prod

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Deploy Extension
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.ECS_HOST }}
                  username: ${{ secrets.ECS_USERNAME }}
                  key: ${{ secrets.ECS_SSH_KEY }}

                  script: |
                      set -e

                        # 1. Go to extension project
                        cd /opt/chrome-extension

                        echo "Updating extension source..."
                        git fetch origin release/prod
                        git reset --hard origin/release/prod

                        # 2. Install dependencies
                        echo "Installing dependencies..."
                        npm install

                        # 3. Build Vue extension
                        echo "Building extension..."
                        rm -rf dist
                        npm run build

                        # 4. Create zip
                        echo "Packaging extension..."
                        rm -f dist.zip
                        cd dist
                        zip -r ../dist.zip .
                        cd ..

                        # 5. Copy artifact
                        echo "Copying extension package..."

                        mkdir -p /opt/build-own-vocabulary/extension-dist

                        cp dist.zip \
                            /opt/build-own-vocabulary/extension-dist/dist.zip

                        echo "Deployment finished"
